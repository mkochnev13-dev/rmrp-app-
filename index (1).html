<html lang="ru">
<head>
<meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#070718;--bg2:#10102e;--card:#ffffff0f;--tx:#f2f2fa;--mu:#9d9db8;--bd:#ffffff1c;--ac:#f5c451;--ac2:#e8913a;--onac:#241600;--gold:#f5c451;--uk:#ff6b7a;--ko:#6aaeff;--tm:#3ddcb8;--pd:#b18cff;--rf:#f5c451;--glow:#f5c45124;--sh:0 8px 28px #00000066}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;color:var(--tx);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(800px 380px at 90% -8%,var(--glow),transparent),radial-gradient(600px 360px at -10% 8%,#5a6bff1f,transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:660px;margin:0 auto;padding:14px 14px 40px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 4px 10px var(--glow))}
.hd h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0;line-height:1.1}
.hd p{margin:2px 0 0;color:var(--mu);font-size:12px}
.hd .sp{flex:1}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--bd);background:var(--card);border-radius:16px;margin-bottom:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tabs button{flex:1;padding:10px 4px;border:0;background:transparent;color:var(--mu);border-radius:12px;font:600 13.5px Manrope,system-ui,sans-serif;cursor:pointer;position:relative}
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);box-shadow:0 4px 14px var(--glow)}
.bdg{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--uk);color:#fff;font-size:11px;line-height:18px}
.sbox{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border:1px solid var(--bd);background:var(--card);border-radius:16px;box-shadow:var(--sh);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sbox:focus-within{border-color:var(--ac)}
.sbox input{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:500 16px Manrope,system-ui,sans-serif;padding:10px 0;min-width:0}
.sbox input::placeholder{color:var(--mu)}
.sbox button{border:0;background:transparent;color:var(--mu);font-size:18px;padding:6px 8px;cursor:pointer}
.sbox button.mic.on{background:var(--uk);color:#fff;border-radius:50%;animation:pls 1.1s ease-in-out infinite}@keyframes pls{0%,100%{box-shadow:0 0 0 0 #ff4d6a66}50%{box-shadow:0 0 0 10px #ff4d6a00}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:600 12.5px Manrope,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--ac);color:var(--ac)}
.card{position:relative;margin-top:12px;padding:14px 14px 14px 18px;border:1px solid var(--bd);background:var(--card);border-radius:18px;box-shadow:var(--sh);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;animation:up .35s ease both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st,var(--ac))}
.card.uk{--st:var(--uk)}.card.ko{--st:var(--ko)}.card.tm{--st:var(--tm)}.card.pd{--st:var(--pd)}.card.rf{--st:var(--rf)}

@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card h3{margin:6px 0 0;font-size:16px;font-weight:700;line-height:1.3}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.2px;color:#fff;background:var(--st,var(--ac))}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{padding:3px 9px;border:1px solid var(--bd);border-radius:20px;font-size:12px;color:var(--tx)}
.st{color:var(--gold);letter-spacing:1px}
.card ul{margin:10px 0 0;padding:0 0 0 18px;font-size:14px}
.card li{margin:5px 0}
.src{margin-top:10px;color:var(--mu);font-size:12px}
.hint{margin-top:12px;padding:12px 14px;border:1px dashed var(--gold);border-radius:16px;font-size:13.5px;background:var(--card)}
.btn{margin-top:12px;padding:10px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);font:700 13.5px Manrope,system-ui,sans-serif;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:13px}
.hide{display:none}
select,.qty{width:100%;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:600 14px Manrope,system-ui,sans-serif}
.g2{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:10px}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.total{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);border:0}
.total::before{display:none}
.total .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.total .st{color:inherit}
.total .mu{color:inherit;opacity:.85}
input.f{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:500 15px Manrope,system-ui,sans-serif}
</style>
</head>

<section id="a" class="hide">

<div id="all"></div>
</section>
</div>

 $("tf").textContent=fmt(f)+" ₽";
 $("tx").innerHTML=out.join("<br>")+(n&&notes.length?`<div class="mu" style="margin-top:8px">• ${notes.join("<br>• ")}</div>`:"")
}

<script>
(function() {
    const SB_URL = "https://unejwdoylcvtwyhjnltp.supabase.co";
    const SB_KEY = "sb_publishable_zxEzT7COe0uFc-WNIY0Qxg_Fmi5x-tO";
    const headers = {
        "apikey": SB_KEY,
        "Authorization": "Bearer " + SB_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
    };

    const lockScreen = document.getElementById("rmrp-lock-screen");
    const lockMsg = document.getElementById("lock-msg");
    const lockForm = document.getElementById("lock-form");
    let currentDevId = null;

    async function getDeviceId() {
        if (window.pywebview && window.pywebview.api) {
            return await window.pywebview.api.get_hwid();
        }
        let id = localStorage.getItem("rmrp_dev_id");
        if (!id) {
            id = "mob_" + Math.random().toString(36).substr(2, 9) + "_" + Date.now();
            localStorage.setItem("rmrp_dev_id", id);
        }
        return id;
    }

    async function checkAccess() {
        currentDevId = await getDeviceId();
        try {
            const res = await fetch(`${SB_URL}/rest/v1/license_keys?device_id=eq.${currentDevId}&select=*`, { headers });
            const data = await res.json();

            if (Array.isArray(data) && data.length > 0) {
                const key = data.at(0);
                const isExpired = new Date(key.expires_at) < new Date();
                if (!key.is_banned && !isExpired) {
                    lockScreen.style.display = "none";
                    return;
                } else if (key.is_banned) {
                    lockMsg.innerText = "Ваш ключ заблокирован администратором.";
                } else {
                    lockMsg.innerText = "Срок действия подписки истек. Введите новый ключ:";
                }
            } else {
                lockMsg.innerText = "Для доступа к приложению введите лицензионный ключ:";
            }
        } catch (e) {
            lockMsg.innerText = "Включите интернет для проверки подписки.";
        }
        lockForm.style.display = "block";
    }

    window.activateKey = async function() {
        const code = document.getElementById("license-input").value.trim().toUpperCase();
        if (!code) return alert("Введите ключ!");
        if (!currentDevId) currentDevId = await getDeviceId();

        lockMsg.innerText = "Проверка ключа...";
        try {
            const res = await fetch(`${SB_URL}/rest/v1/license_keys?key_code=eq.${code}&select=*`, { headers });
            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
                lockMsg.innerText = "Неверный ключ! Проверьте правильность ввода.";
                return;
            }

            const key = data.at(0);
            if (key.is_banned) {
                lockMsg.innerText = "Этот ключ заблокирован.";
                return;
            }
            if (key.device_id && key.device_id !== currentDevId) {
                lockMsg.innerText = "Этот ключ уже активирован на другом устройстве!";
                return;
            }

            let expDate = key.expires_at;
            if (!expDate) {
                const d = new Date();
                d.setDate(d.getDate() + key.days);
                expDate = d.toISOString();
            } else if (new Date(expDate) < new Date()) {
                lockMsg.innerText = "Срок действия этого ключа уже истек.";
                return;
            }

            await fetch(`${SB_URL}/rest/v1/license_keys?key_code=eq.${code}`, {
                method: "PATCH",
                headers: headers,
                body: JSON.stringify({ device_id: currentDevId, expires_at: expDate })
            });

            lockScreen.style.display = "none";
        } catch (e) {
            lockMsg.innerText = "Ошибка сети. Попробуйте еще раз.";
        }
    };

    if (window.pywebview) {
        checkAccess();
    } else {
        window.addEventListener('pywebviewready', checkAccess);
        setTimeout(() => { if (!currentDevId) checkAccess(); }, 500);
    }
})();
</script>
